<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <title>Confirm Delete</title>  
</head>  
<body>  
    <div class="confirm-box">  
        <h2>⚠️ Are you sure you want to delete "{{ file.title }}"?</h2>  
        <form method="POST">  
            {% csrf_token %}  
            <button type="submit" class="delete-btn">Yes, Delete</button>  
            <a href="/" class="cancel-btn">Cancel</a>  
        </form>  
    </div>  
</body>  
</html>
