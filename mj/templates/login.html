{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h2>Admin Login</h2>
            <p class="subtitle">Login to access employee records</p>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit">Login</button>
            </form>

            {% if form.errors %}
                <p class="error">
                    Username ya password galat hai.
                </p>
            {% endif %}

        </div>

    </div>

</body>
</html>
